# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - giolab #nome do worflow (aparece em actions)
#nessa linguagem, a identação é que dá a hierarquia
on: #sempre / quando
  push: # houver um push
    branches: #nas branchs
      - 'main' #main
  workflow_dispatch: #ou dar um start manualemnte nos comandos

jobs: #começa aqui O QUE é pra fazer
  build: #constroi a aplicação
    runs-on: ubuntu-latest #que vai rodar num linux
    permissions: #declara que vai passar as permissoes
      contents: read #This is required for actions/checkout (esse ja tava aqui)
              #permissão = ler o codigo

    steps: #passo a passo dentro desse job
      - uses: actions/checkout@v4 #é o qie vai baixar o codigo do repositorio

      - name: Set up Python version #nome que vai ter
        uses: actions/setup-python@v5 # configura o ambiente python no git
        with: #com que versão?
          python-version: '3.14' #ai passa a versão

      # 🛠️ Local Build Section (Optional)
      # The following section in your workflow is designed to catch build issues early on the client side, before deployment. This can be helpful for debugging and validation. However, if this step significantly increases deployment time and early detection is not critical for your workflow, you may remove this section to streamline the deployment process.
      - name: Create and Start virtual environment and Install dependencies #parte para validar dependencias
        run: | #deoendencias que vao ser instaladas
          python -m venv antenv #cria ambiente virtual isolado
          source antenv/bin/activate #ativa o ambiente
          pip install -r requirements.txt #instala os que estiver no requirements.txt
                
      # By default, when you enable GitHub CI/CD integration through the Azure portal, the platform automatically sets the SCM_DO_BUILD_DURING_DEPLOYMENT application setting to true. This triggers the use of Oryx, a build engine that handles application compilation and dependency installation (e.g., pip install) directly on the platform during deployment. Hence, we exclude the antenv virtual environment directory from the deployment artifact to reduce the payload size. 
      - name: Upload artifact for deployment jobs #titulo: upload de arquivos pra deploy
        uses: actions/upload-artifact@v4 #empacota os arquivos pro proximo job
        with: #com...
          name: python-app #...nome: python-app
          path: |
            . #inclui tudo do diretorio atual
            !antenv/ #exclui a pasta do ambiente virtual para nao pesar na nuvem

      # 🚫 Opting Out of Oryx Build
      # If you prefer to disable the Oryx build process during deployment, follow these steps:
      # 1. Remove the SCM_DO_BUILD_DURING_DEPLOYMENT app setting from your Azure App Service Environment variables.
      # 2. Refer to sample workflows for alternative deployment strategies: https://github.com/Azure/actions-workflow-samples/tree/master/AppService
      

  deploy: #envia e publica na nuvem
    runs-on: ubuntu-latest #roda em linux
    needs: build #outro job que so é executado se o outro der certo
    permissions: #permissões do job
      id-token: write #This is required for requesting the JWT - gerar e solicitar o token (JWT) da azure
      contents: read #This is required for actions/checkout - leitura dos conteudos do repositorio

    steps: #passo a passo
      - name: Download artifact from build job #nome
        uses: actions/download-artifact@v4 # baixa o python-app que foi empacotado nesse ultimo job
        with: #com...
          name: python-app #...esse nome
      
      - name: Login to Azure
        uses: azure/login@v2 #autenticação na nuvem da azure
        with: #pra isso / usando...
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C723C82B4B7248648485E12A2738E375 }} #chave do app da azure
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DE9DAAB11442490293F412D39A01B7FB }} #identifica o diretorio da azure
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_80FCE8A9D92B41C5AD0987BDEE18688E }} #ID de assinatura de cobrança da nuvem

      - name: 'Deploy to Azure Web App' #nome da ação
        uses: azure/webapps-deploy@v3 #ação oficial 
        id: deploy-to-webapp #identificação da ação
        with:
          app-name: 'giolab' #app service criado na azure 
          slot-name: 'Production' #ambiente de publicação 
          
